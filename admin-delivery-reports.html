<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تقارير المندوبين</title><style>body{font-family:Tahoma;background:#f4f7f6;margin:0;padding:25px}.nav a{display:inline-block;background:#2c3e50;color:#fff;padding:10px;margin:4px;text-decoration:none;border-radius:5px}.box{background:#fff;padding:22px;border-radius:9px;box-shadow:0 2px 7px #0002;margin-top:15px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:10px;text-align:center}th{background:#2c3e50;color:#fff}button{padding:7px 12px;border:0;border-radius:5px;color:#fff;background:#2980b9;cursor:pointer}.muted{color:#667085}</style></head><body><div class="nav"><a href="admin.html">لوحة الإدارة</a><a href="admin-branches.html">إدارة الفروع</a><a href="admin-branch-reports.html">تقارير الفروع</a></div><div class="box"><h2>السجل المحاسبي للمندوبين</h2><p id="status" class="muted"></p><table><thead><tr><th>المندوب</th><th>الهاتف</th><th>الشحنات النشطة</th><th>الإجمالي</th><th>المصفّى</th><th>المتبقي</th><th>التفاصيل</th></tr></thead><tbody id="summary"></tbody></table></div><div class="box" id="details" hidden><h3 id="title"></h3><table><thead><tr><th>الطلب</th><th>العميل</th><th>الهاتف</th><th>المبلغ</th><th>الحالة</th><th>الفرع</th></tr></thead><tbody id="orders"></tbody></table></div><script type="module">import{requireStaff,listDeliveries,listOrders,listSettlements,orderAmount,orderDelivery,orderBranch,orderLabel,customerName,customerPhone}from'./js/operations-cloud.js';await requireStaff();let deliveries=[],allOrders=[],settlements=[];const fmt=n=>`$${Number(n||0).toFixed(2)}`;async function load(){status.textContent='جاري التحميل من Supabase...';[deliveries,allOrders,settlements]=await Promise.all([listDeliveries(),listOrders(),listSettlements()]);summary.innerHTML=deliveries.map(d=>{const rows=allOrders.filter(o=>orderDelivery(o)===d.name&&!o.payload?.isSettled);const total=rows.reduce((s,o)=>s+orderAmount(o),0);const settled=settlements.filter(r=>(r.payload?.deliveryName||'')===d.name).reduce((s,r)=>s+Number(r.payload?.amount||0),0);return`<tr><td>${d.name}</td><td>${d.phone||''}</td><td>${rows.length}</td><td>${fmt(total)}</td><td>${fmt(settled)}</td><td>${fmt(total)}</td><td><button data-name="${d.name}">عرض</button></td></tr>`}).join('')||'<tr><td colspan="7">لا توجد مناديب</td></tr>';summary.querySelectorAll('[data-name]').forEach(x=>x.onclick=()=>show(x.dataset.name));status.textContent='';}function show(name){details.hidden=false;title.textContent=`تفاصيل المندوب: ${name}`;const rows=allOrders.filter(o=>orderDelivery(o)===name&&!o.payload?.isSettled);orders.innerHTML=rows.map(o=>`<tr><td>${orderLabel(o)}</td><td>${customerName(o)}</td><td>${customerPhone(o)}</td><td>${fmt(orderAmount(o))}</td><td>${o.status||''}</td><td>${orderBranch(o)||'---'}</td></tr>`).join('')||'<tr><td colspan="6">لا توجد شحنات نشطة</td></tr>';}await load();</script></body></html>
