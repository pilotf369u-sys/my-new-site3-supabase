<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إنشاء حساب - MeshWar</title>
  <style>
    *{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f4f6f9;margin:0;padding:20px;min-height:100vh;display:flex;align-items:center;justify-content:center}.card{width:100%;max-width:500px;background:#fff;padding:32px;border-radius:16px;border-top:5px solid #c00;box-shadow:0 10px 25px rgba(0,0,0,.06)}h2{text-align:center;color:#c00;margin-top:0}.group{margin-bottom:16px}label{display:block;font-weight:bold;margin-bottom:7px;color:#4a5568}input,select{width:100%;padding:12px;border:1px solid #dfe3e8;border-radius:8px;font-size:15px}.phone-row{display:flex;gap:8px}.phone-row select{width:165px}.phone-row input{flex:1}button{width:100%;padding:13px;border:0;border-radius:8px;background:#c00;color:#fff;font-weight:bold;font-size:16px;cursor:pointer}button:disabled{opacity:.65}.error{min-height:22px;color:#b00020;font-size:14px;margin-top:8px}.footer{text-align:center;margin-top:18px}.footer a{color:#0366a6;text-decoration:none;font-weight:bold}.verify{display:none}.otp{display:flex;gap:8px;direction:ltr;margin:18px 0}.otp input{text-align:center;font-size:20px;font-weight:bold}.hint{color:#666;font-size:13px;text-align:center}
  </style>
</head>
<body>
  <div class="card" id="registerStep">
    <h2>إنشاء حساب جديد</h2>
    <p class="hint">سيتم إرسال رمز SMS مرة واحدة لتأكيد رقم الهاتف.</p>
    <form id="registerForm" novalidate>
      <div class="group"><label for="fullName">الاسم الكامل</label><input id="fullName" required></div>
      <div class="group"><label for="phone">رقم الهاتف</label><div class="phone-row"><select id="countryCode"><option value="+964">العراق (+964)</option><option value="+90">تركيا (+90)</option><option value="+966">السعودية (+966)</option><option value="+971">الإمارات (+971)</option></select><input id="phone" type="tel" inputmode="numeric" placeholder="7701234567" required></div></div>
      <div class="group"><label for="email">البريد الإلكتروني (اختياري)</label><input id="email" type="email" autocomplete="email"></div>
      <div class="group"><label for="password">كلمة المرور</label><input id="password" type="password" minlength="6" autocomplete="new-password" placeholder="6 أحرف على الأقل" required></div>
      <div class="group"><label for="confirmPassword">تأكيد كلمة المرور</label><input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required></div>
      <div class="group"><label for="address">العنوان الكامل</label><input id="address" required></div>
      <button type="submit" id="registerBtn">إرسال رمز التحقق</button>
      <div class="error" id="registerError" aria-live="polite"></div>
    </form>
    <div class="footer">لديك حساب؟ <a href="login.html">تسجيل الدخول</a></div>
  </div>

  <div class="card verify" id="verifyStep">
    <h2>تأكيد رقم الهاتف</h2>
    <p class="hint" id="verifyMessage"></p>
    <form id="verifyForm" novalidate>
      <div class="otp"><input maxlength="1"><input maxlength="1"><input maxlength="1"><input maxlength="1"><input maxlength="1"><input maxlength="1"></div>
      <button type="submit" id="verifyBtn">تأكيد الرمز وإنشاء الحساب</button>
      <div class="error" id="verifyError" aria-live="polite"></div>
    </form>
    <div class="footer"><a href="#" id="resendLink">إعادة إرسال الرمز</a></div>
  </div>

  <script type="module">
    import { normalizePhone, sendPhoneOtp, verifyPhoneOtp, setCurrentUserPassword, syncLegacySession } from './js/auth-service.js';

    let registrationData = null;
    const registerStep = document.getElementById('registerStep');
    const verifyStep = document.getElementById('verifyStep');

    document.getElementById('registerForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const errorBox = document.getElementById('registerError');
      const button = document.getElementById('registerBtn');
      errorBox.textContent = '';

      const fullName = document.getElementById('fullName').value.trim();
      const localPhone = document.getElementById('phone').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const address = document.getElementById('address').value.trim();
      const countrySelect = document.getElementById('countryCode');

      if (!fullName || !localPhone || !address || !password) {
        errorBox.textContent = 'أكمل جميع الحقول المطلوبة.';
        return;
      }
      if (password.length < 6) {
        errorBox.textContent = 'يجب أن تتكون كلمة المرور من 6 أحرف على الأقل.';
        return;
      }
      if (password !== confirmPassword) {
        errorBox.textContent = 'كلمتا المرور غير متطابقتين.';
        return;
      }

      registrationData = {
        phone: normalizePhone(countrySelect.value, localPhone),
        fullName,
        country: countrySelect.selectedOptions[0].text.split('(')[0].trim(),
        address,
        email,
        password,
      };

      button.disabled = true;
      button.textContent = 'جاري إرسال الرمز...';
      try {
        await sendPhoneOtp(registrationData);
        document.getElementById('verifyMessage').textContent = `تم إرسال رمز التحقق إلى ${registrationData.phone}`;
        registerStep.style.display = 'none';
        verifyStep.style.display = 'block';
      } catch (error) {
        errorBox.textContent = error.message;
      } finally {
        button.disabled = false;
        button.textContent = 'إرسال رمز التحقق';
      }
    });

    document.querySelectorAll('.otp input').forEach((input, index, inputs) => {
      input.addEventListener('input', () => {
        input.value = input.value.replace(/\D/g, '').slice(0, 1);
        if (input.value && inputs[index + 1]) inputs[index + 1].focus();
      });
    });

    document.getElementById('verifyForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const errorBox = document.getElementById('verifyError');
      const button = document.getElementById('verifyBtn');
      const token = Array.from(document.querySelectorAll('.otp input')).map(input => input.value).join('');
      errorBox.textContent = '';

      if (!registrationData || !/^\d{6}$/.test(token)) {
        errorBox.textContent = 'أدخل رمزاً صحيحاً من 6 أرقام.';
        return;
      }

      button.disabled = true;
      button.textContent = 'جاري إنشاء الحساب...';
      try {
        await verifyPhoneOtp(registrationData.phone, token);
        await setCurrentUserPassword(registrationData.password);
        await syncLegacySession();
        localStorage.removeItem('adminImpersonatingCustomer');
        window.location.replace('index.html');
      } catch (error) {
        errorBox.textContent = error.message;
      } finally {
        button.disabled = false;
        button.textContent = 'تأكيد الرمز وإنشاء الحساب';
      }
    });

    document.getElementById('resendLink').addEventListener('click', async (event) => {
      event.preventDefault();
      if (!registrationData) return;
      try { await sendPhoneOtp(registrationData); alert('تمت إعادة إرسال الرمز.'); }
      catch (error) { document.getElementById('verifyError').textContent = error.message; }
    });
  </script>
</body>
</html>
