<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تقنيات</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f9f9f9; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 20px; justify-items: center; }
        .store-card { background: white; border: 1px solid #ddd; border-radius: 15px; padding: 20px; width: 180px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .store-logo { width: 96px; height: 96px; display: block; margin: 0 auto 10px; }
        .store-link { display: inline-block; padding: 10px 20px; background-color: #d35400; color: white; text-decoration: none; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body>

    <h2 class="section-title">تقنيات</h2>
    
    <div class="grid-container">
        <div class="store-card">
            <div class="logo-container">
                <img class="store-logo" src="images/tech.png" alt="متجر">
            </div>
            <h3>اسم المتجر</h3>
            <a class="store-link" href="#">دخول</a>
        </div>
    </div>

</body>
</html>
