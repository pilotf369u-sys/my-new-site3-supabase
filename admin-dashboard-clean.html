<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>لوحة الإدارة - MeshWar</title>
<script>
(async function removeOldBrowserCaches() {
  try {
    if ('serviceWorker' in navigator) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map(registration => registration.unregister()));
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(key => caches.delete(key)));
    }
  } catch (error) {
    console.error('[Cache cleanup]', error);
  }
})();
</script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,sans-serif;background:#f4f7f6;color:#222}.top{background:#263746;color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}.top button{background:#c0392b}.wrap{max-width:1500px;margin:auto;padding:22px}.tabs{display:flex;gap:10px;margin-bottom:18px}.tabs button{background:#34495e}.tabs button.active{background:#16a085}.panel{display:none;background:#fff;padding:20px;border-radius:10px;box-shadow:0 2px 8px #0001}.panel.active{display:block}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:18px}.form input,.form select{padding:10px;border:1px solid #ccd3d8;border-radius:6px;width:100%}button{border:0;border-radius:6px;padding:9px 14px;color:#fff;font-weight:bold;cursor:pointer}.green{background:#27ae60}.blue{background:#2980b9}.red{background:#c0392b}.gray{background:#7f8c8d}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:10px;border:1px solid #e1e5e8;text-align:center}th{background:#2c3e50;color:#fff}.scroll{overflow:auto}.msg{margin:10px 0;min-height:24px;color:#b00020}.loading{padding:30px;text-align:center;color:#667}
</style>
</head>
<body>
<div class="top"><strong>لوحة إدارة MeshWar</strong><button id="logoutBtn">تسجيل الخروج</button></div>
<div class="wrap">
<div class="tabs"><button data-tab="orders" class="active">إدارة الطلبات</button><button data-tab="customers">إدارة العملاء</button></div>
<section id="orders" class="panel active"><h2>الطلبات</h2><div id="ordersMsg" class="msg"></div><div class="scroll"><table><thead><tr><th>رقم الطلب</th><th>العميل</th><th>الهاتف</th><th>العنوان</th><th>السعر</th><th>الحالة</th><th>تحديث</th></tr></thead><tbody id="ordersBody"><tr><td colspan="7" class="loading">جاري التحميل...</td></tr></tbody></table></div></section>
<section id="customers" class="panel"><h2 id="formTitle">إضافة عميل</h2><input type="hidden" id="customerId"><div class="form"><input id="name" placeholder="اسم العميل"><input id="code" placeholder="كود العميل (يُنشأ تلقائياً)"><input id="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><select id="country"><option value="العراق">العراق</option><option value="تركيا">تركيا</option><option value="السعودية">السعودية</option><option value="الإمارات">الإمارات</option></select><input id="phone" placeholder="رقم الهاتف"><input id="state" placeholder="المدينة / المحافظة"><input id="address" placeholder="العنوان"></div><button id="saveBtn" class="green">حفظ العميل</button> <button id="cancelBtn" class="gray" style="display:none">إلغاء التعديل</button><div id="customersMsg" class="msg"></div><div class="scroll"><table><thead><tr><th>الكود</th><th>الاسم</th><th>الهاتف</th><th>الدولة</th><th>العنوان</th><th>عدد الطلبات</th><th>الإجراء</th></tr></thead><tbody id="customersBody"><tr><td colspan="7" class="loading">جاري التحميل...</td></tr></tbody></table></div></section>
</div>
<script type="module">
import { supabase } from './js/supabase-client.js?v=20260805-21';
const $=id=>document.getElementById(id);let customers=[],orders=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#039;'}[c]));
function shortCode(){return `CUS-${Math.floor(1000+Math.random()*9000)}`;}
async function requireAdmin(){const {data:{user}}=await supabase.auth.getUser();if(!user){location.replace('login.html');return false;}const {data,error}=await supabase.from('profiles').select('role').eq('id',user.id).single();if(error||data?.role!=='admin'){location.replace('login.html');return false;}return true;}
function resetForm(){['customerId','name','code','email','password','phone','state','address'].forEach(id=>$(id).value='');$('country').value='العراق';$('formTitle').textContent='إضافة عميل';$('cancelBtn').style.display='none';}
function render(){const count=new Map();for(const o of orders){if(o.customer_id)count.set(o.customer_id,(count.get(o.customer_id)||0)+1);}const byId=new Map(customers.map(c=>[c.id,c]));$('customersBody').innerHTML=customers.length?customers.map(c=>`<tr><td>${esc(c.customer_code||c.payload?.code||'---')}</td><td>${esc(c.name)}</td><td dir="ltr">${esc(c.phone)}</td><td>${esc(c.country||'---')}</td><td>${esc(c.address||'---')}</td><td>${count.get(c.id)||0}</td><td><button class="blue" data-edit="${c.id}">تعديل</button> <button class="red" data-delete="${c.id}">حذف</button> <button class="green" data-view="${c.id}">دخول</button></td></tr>`).join(''):'<tr><td colspan="7">لا يوجد عملاء</td></tr>';$('ordersBody').innerHTML=orders.length?orders.map(o=>{const c=byId.get(o.customer_id)||{};return `<tr><td>${esc(o.legacy_id||o.payload?.id||o.id)}</td><td>${esc(c.name||o.payload?.customerName||'---')}</td><td dir="ltr">${esc(c.phone||o.customer_phone||'---')}</td><td>${esc(c.address||o.payload?.address||'---')}</td><td>${esc(o.payload?.price||'$0.00')}</td><td>${esc(o.status||'قيد المعالجة')}</td><td><select data-order="${o.id}">${['قيد المعالجة','قيد المراجعة','قيد الشحن','تم التوصيل','تم التسليم','ملغي'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`}).join(''):'<tr><td colspan="7">لا توجد طلبات</td></tr>';}
async function load(){const [cr,or]=await Promise.all([supabase.from('customers').select('*').order('created_at',{ascending:true}),supabase.from('orders').select('*').order('created_at',{ascending:true})]);if(cr.error)throw cr.error;if(or.error)throw or.error;customers=cr.data||[];orders=or.data||[];render();}
$('saveBtn').onclick=async()=>{const id=$('customerId').value||null;const password=$('password').value;if(!id&&password.length<4){$('customersMsg').textContent='كلمة المرور يجب أن تكون 4 خانات على الأقل.';return;}const code=$('code').value.trim()||shortCode();$('code').value=code;$('saveBtn').disabled=true;$('customersMsg').textContent='';const {error}=await supabase.rpc('admin_upsert_customer_account_v2',{p_customer_id:id,p_name:$('name').value.trim(),p_phone:$('phone').value.trim(),p_password:password,p_customer_code:code,p_email:$('email').value.trim()||null,p_country:$('country').value||null,p_address:$('address').value.trim()||null,p_state:$('state').value.trim()||null});$('saveBtn').disabled=false;if(error){$('customersMsg').textContent=error.message;return;}resetForm();await load();$('customersMsg').textContent='تم الحفظ بنجاح.';};
$('cancelBtn').onclick=resetForm;
$('customersBody').onclick=async e=>{const edit=e.target.dataset.edit,del=e.target.dataset.delete,view=e.target.dataset.view;if(edit){const c=customers.find(x=>x.id===edit);$('customerId').value=c.id;$('name').value=c.name||'';$('code').value=c.customer_code||c.payload?.code||'';$('email').value=c.email||'';$('country').value=c.country||'العراق';$('phone').value=c.phone||'';$('state').value=c.payload?.state||'';$('address').value=c.address||'';$('password').value='';$('formTitle').textContent='تعديل العميل';$('cancelBtn').style.display='inline-block';scrollTo({top:0,behavior:'smooth'});}if(del&&confirm('حذف العميل وطلباته المرتبطة؟')){const {error}=await supabase.from('customers').delete().eq('id',del);if(error)return alert(error.message);await load();}if(view){const c=customers.find(x=>x.id===view);sessionStorage.setItem('selectedCustomerPhone',String(c.phone||'').replace(/\D/g,''));location.href=`dashboard.html?phone=${encodeURIComponent(String(c.phone||'').replace(/\D/g,''))}&view=admin`;}};
$('ordersBody').onchange=async e=>{const id=e.target.dataset.order;if(!id)return;const {error}=await supabase.from('orders').update({status:e.target.value,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else await load();};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===b.dataset.tab));});
$('logoutBtn').onclick=async()=>{await supabase.auth.signOut();location.replace('login.html');};
if(await requireAdmin())load().catch(e=>{$('ordersMsg').textContent=e.message;$('customersMsg').textContent=e.message;});
</script>
</body></html>
