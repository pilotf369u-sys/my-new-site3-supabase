<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الفروع</title><style>body{font-family:Tahoma;background:#f4f7f6;margin:0;display:flex}.sidebar{width:250px;background:#2c3e50;color:#fff;min-height:100vh;padding:20px;box-sizing:border-box;position:fixed;right:0}.sidebar a{display:block;color:#fff;text-decoration:none;padding:10px;margin:8px 0;background:#34495e;border-radius:4px}.sidebar a.active{background:#1abc9c}.main{margin-right:250px;padding:30px;width:calc(100% - 250px)}.box{background:#fff;padding:25px;border-radius:8px;box-shadow:0 2px 5px #0002}form{display:flex;gap:10px;flex-wrap:wrap;background:#f9f9f9;padding:15px}input,button{padding:9px;border:1px solid #ccc;border-radius:5px}input{flex:1;min-width:170px}button{background:#27ae60;color:#fff;border:0;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{border:1px solid #ddd;padding:10px;text-align:center}th{background:#2c3e50;color:#fff}.danger{background:#c0392b}</style></head><body><aside class="sidebar"><h2>لوحة الإدارة</h2><a href="admin.html">لوحة الإدارة</a><a href="admin-delivery-reports.html">تقارير المندوبين</a><a class="active" href="admin-branches.html">إدارة الفروع</a><a href="admin-branch-reports.html">تقارير الفروع</a><a href="login.html">تسجيل الخروج</a></aside><main class="main"><div class="box"><h2>إدارة الفروع والشركات الموزعة</h2><form id="branchForm"><input id="branchName" placeholder="اسم الفرع" required><input id="branchPhone" placeholder="رقم الهاتف" required><input id="branchPassword" type="password" placeholder="كلمة المرور" required><input id="branchAddress" placeholder="العنوان" required><button>إضافة الفرع</button></form><p id="status"></p><table><thead><tr><th>الاسم</th><th>الهاتف</th><th>العنوان</th><th>الإجراء</th></tr></thead><tbody id="body"></tbody></table></div></main><script type="module">import{requireStaff,listBranches,saveBranch,deleteBranch}from'./js/operations-cloud.js';await requireStaff();const body=document.getElementById('body'),status=document.getElementById('status');async function load(){status.textContent='جاري التحميل...';try{const rows=await listBranches();body.innerHTML=rows.length?rows.map(r=>`<tr><td>${r.name||''}</td><td dir="ltr">${r.phone||''}</td><td>${r.payload?.address||''}</td><td><button class="danger" data-id="${r.id}">حذف</button></td></tr>`).join(''):'<tr><td colspan="4">لا توجد فروع</td></tr>';body.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{if(confirm('حذف الفرع؟')){await deleteBranch(b.dataset.id);await load();}});status.textContent='';}catch(e){status.textContent=e.message}}document.getElementById('branchForm').onsubmit=async e=>{e.preventDefault();try{await saveBranch({name:branchName.value,phone:branchPhone.value,password:branchPassword.value,address:branchAddress.value});e.target.reset();await load();alert('تم الحفظ في Supabase');}catch(err){alert(err.message)}};await load();</script></body></html>
