<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>لوحة الإدارة - MeshWar</title>
  <style>html,body,#adminFrame{width:100%;height:100%;margin:0;border:0;display:block}</style>
</head>
<body>
<iframe id="adminFrame" src="admin-dashboard.html?v=20260805-27" title="لوحة الإدارة"></iframe>
<script>
(async function () {
  try {
    if ('serviceWorker' in navigator) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map(registration => registration.unregister()));
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(key => caches.delete(key)));
    }
  } catch (error) {
    console.error('[Admin cache cleanup]', error);
  }

  const frame = document.getElementById('adminFrame');
  frame.addEventListener('load', () => {
    const doc = frame.contentDocument;
    if (!doc || doc.querySelector('script[data-supabase-bridge]')) return;
    const script = doc.createElement('script');
    script.type = 'module';
    script.dataset.supabaseBridge = '20260805-27';
    script.src = 'js/admin-supabase-bridge.js?v=20260805-27';
    doc.head.appendChild(script);
  });
})();
</script>
</body>
</html>
