<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #top-bar { 
            background: #25d366; color: white; padding: 15px; text-align: center; 
            font-weight: bold; cursor: pointer; position: sticky; top: 0; z-index: 9999;
        }
        iframe { width: 100%; height: 90vh; border: none; }
    </style>
</head>
<body>

    <div id="top-bar" onclick="alert('قم بنسخ رابط المتجر من الشريط العلوي أو من خلال الضغط بالزر الأيمن')">
        اضغط هنا للطلب: (انسخ الرابط من فوق ثم أرسله لي)
    </div>

    <iframe id="storeFrame" src=""></iframe>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById('storeFrame').src = urlParams.get('url');
    </script>
</body>
</html>
