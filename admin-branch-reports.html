<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تقارير الفروع</title><style>body{font-family:Tahoma;background:#f4f7f6;margin:0;padding:25px}.nav a{display:inline-block;background:#2c3e50;color:#fff;padding:10px;margin:4px;text-decoration:none;border-radius:5px}.box{background:#fff;padding:22px;border-radius:9px;box-shadow:0 2px 7px #0002;margin-top:15px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:10px;text-align:center}th{background:#2c3e50;color:#fff}button{padding:7px 12px;border:0;border-radius:5px;color:#fff;background:#2980b9;cursor:pointer}.ok{background:#27ae60}.muted{color:#667085}</style></head><body><div class="nav"><a href="admin.html">لوحة الإدارة</a><a href="admin-branches.html">إدارة الفروع</a><a href="admin-delivery-reports.html">تقارير المندوبين</a></div><div class="box"><h2>السجل المحاسبي للفروع</h2><p id="status" class="muted"></p><table><thead><tr><th>الفرع</th><th>الهاتف</th><th>الشحنات</th><th>الإجمالي</th><th>المحصّل</th><th>المتبقي</th><th>التفاصيل</th></tr></thead><tbody id="summary"></tbody></table></div><div class="box" id="details" hidden><h3 id="title"></h3><table><thead><tr><th>الطلب</th><th>العميل</th><th>الهاتف</th><th>المبلغ</th><th>الحالة</th><th>التحصيل</th><th>إجراء</th></tr></thead><tbody id="orders"></tbody></table></div><script type="module">import{requireStaff,listBranches,listOrders,orderAmount,orderBranch,orderLabel,customerName,customerPhone,setOrderCollection}from'./js/operations-cloud.js';await requireStaff();let branches=[],allOrders=[];const fmt=n=>`$${Number(n||0).toFixed(2)}`;async function load(){status.textContent='جاري التحميل من Supabase...';[branches,allOrders]=await Promise.all([listBranches(),listOrders()]);summary.innerHTML=branches.map(b=>{const rows=allOrders.filter(o=>orderBranch(o)===b.name);const total=rows.reduce((s,o)=>s+orderAmount(o),0);const collected=rows.filter(o=>o.payload?.isSettled||o.payload?.branchFinancialStatus==='تم التوريد للخزينة').reduce((s,o)=>s+orderAmount(o),0);return`<tr><td>${b.name}</td><td>${b.phone||''}</td><td>${rows.length}</td><td>${fmt(total)}</td><td>${fmt(collected)}</td><td>${fmt(total-collected)}</td><td><button data-branch="${b.name}">عرض</button></td></tr>`}).join('')||'<tr><td colspan="7">لا توجد فروع</td></tr>';summary.querySelectorAll('[data-branch]').forEach(x=>x.onclick=()=>show(x.dataset.branch));status.textContent='';}function show(name){details.hidden=false;title.textContent=`تفاصيل فرع: ${name}`;const rows=allOrders.filter(o=>orderBranch(o)===name);orders.innerHTML=rows.map(o=>{const done=o.payload?.isSettled||o.payload?.branchFinancialStatus==='تم التوريد للخزينة';return`<tr><td>${orderLabel(o)}</td><td>${customerName(o)}</td><td>${customerPhone(o)}</td><td>${fmt(orderAmount(o))}</td><td>${o.status||''}</td><td>${done?'تم التوريد':'معلق'}</td><td><button class="${done?'':'ok'}" data-order="${o.id}" data-value="${done?'0':'1'}">${done?'إلغاء التوريد':'استلام وتوريد'}</button></td></tr>`}).join('')||'<tr><td colspan="7">لا توجد طلبات</td></tr>';orders.querySelectorAll('[data-order]').forEach(x=>x.onclick=async()=>{await setOrderCollection(x.dataset.order,x.dataset.value==='1');await load();show(name);});}await load();</script></body></html>
