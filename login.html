<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول - MeshWar</title><style>
body{font-family:Tahoma,sans-serif;background:#f4f6f9;padding:20px;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}.box{background:#fff;padding:30px;border-radius:15px;width:100%;max-width:400px;box-shadow:0 4px 10px rgba(0,0,0,.1)}h2{text-align:center;color:#2c3e50}input,select{width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}button{width:100%;padding:12px;background:#c00;color:#fff;border:0;border-radius:8px;cursor:pointer;font-weight:bold;font-size:16px;margin-top:8px}button.secondary{background:#666}p{text-align:center}a{color:#2980b9;text-decoration:none}.status{text-align:center;min-height:24px;color:#555}
</style></head><body><div class="box"><h2>تسجيل الدخول برقم الهاتف</h2><div id="phoneStep"><select id="countryCode"><option value="+964">العراق (+964)</option><option value="+90">تركيا (+90)</option><option value="+966">السعودية (+966)</option><option value="+971">الإمارات (+971)</option></select><input type="tel" id="phone" placeholder="7701234567" inputmode="numeric"><button id="sendBtn">إرسال رمز الدخول</button></div><div id="otpStep" style="display:none"><input type="text" id="otp" placeholder="رمز التحقق من 6 أرقام" maxlength="6" inputmode="numeric" autocomplete="one-time-code"><button id="verifyBtn">تأكيد الرمز والدخول</button><button class="secondary" id="backBtn">تغيير الرقم</button></div><div class="status" id="status"></div><p><a href="register.html">ليس لديك حساب؟ سجل الآن</a></p></div>
<script type="module">import{normalizePhone,sendPhoneOtp,verifyPhoneOtp,syncLegacySession}from'./js/auth-service.js';let pending='';const status=document.getElementById('status');document.getElementById('sendBtn').onclick=async()=>{const raw=document.getElementById('phone').value.trim();if(!raw)return alert('أدخل رقم الهاتف.');pending=normalizePhone(document.getElementById('countryCode').value,raw);status.textContent='جاري إرسال الرمز...';try{await sendPhoneOtp({phone:pending});document.getElementById('phoneStep').style.display='none';document.getElementById('otpStep').style.display='block';status.textContent='تم إرسال رمز التحقق عبر SMS.'}catch(e){status.textContent='';alert(e.message)}};document.getElementById('verifyBtn').onclick=async()=>{const token=document.getElementById('otp').value.replace(/\D/g,'');if(!/^\d{6}$/.test(token))return alert('أدخل رمزاً من 6 أرقام.');status.textContent='جاري التحقق...';try{await verifyPhoneOtp(pending,token);await syncLegacySession();location.href='dashboard.html'}catch(e){status.textContent='';alert(e.message)}};document.getElementById('backBtn').onclick=()=>{pending='';document.getElementById('otpStep').style.display='none';document.getElementById('phoneStep').style.display='block';status.textContent=''};</script></body></html>
