<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول - MeshWar</title>
  <style>
    *{box-sizing:border-box} body{font-family:Tahoma,sans-serif;background:#f4f6f9;padding:20px;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}.box{background:#fff;padding:30px;border-radius:15px;width:100%;max-width:430px;box-shadow:0 4px 14px rgba(0,0,0,.1)}h2{text-align:center;color:#2c3e50;margin-top:0}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px;background:#f1f3f5;padding:5px;border-radius:10px}.tab-btn{margin:0;background:transparent;color:#555;border:0}.tab-btn.active{background:#c00;color:#fff}.panel{display:none}.panel.active{display:block}label{display:block;font-weight:bold;margin-top:10px;color:#333}input,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;font-size:15px}button{width:100%;padding:12px;background:#c00;color:#fff;border:0;border-radius:8px;cursor:pointer;font-weight:bold;font-size:16px;margin-top:8px}button:disabled{opacity:.65}.form-error{min-height:22px;margin-top:8px;color:#b00020;font-size:14px}.hint{text-align:center;font-size:13px;color:#777}a{color:#2980b9;text-decoration:none}
  </style>
</head>
<body>
<div class="box">
  <h2>تسجيل الدخول</h2>
  <div class="tabs">
    <button type="button" class="tab-btn active" id="customerTab">دخول العميل</button>
    <button type="button" class="tab-btn" id="staffTab">دخول الإدارة</button>
  </div>

  <section id="customerPanel" class="panel active">
    <form id="customerForm">
      <label for="countryCode">رمز الدولة</label>
      <select id="countryCode"><option value="+964">العراق (+964)</option><option value="+90">تركيا (+90)</option><option value="+966">السعودية (+966)</option><option value="+971">الإمارات (+971)</option></select>
      <label for="phone">رقم الهاتف</label>
      <input type="tel" id="phone" placeholder="7701234567" required>
      <label for="customerPassword">كلمة المرور</label>
      <input type="password" id="customerPassword" required>
      <button type="submit" id="customerLoginBtn">تسجيل الدخول كعميل</button>
      <div id="customerError" class="form-error"></div>
    </form>
    <p class="hint">بيانات الدخول يمنحها لك الأدمن عند إنشاء حسابك.</p>
  </section>

  <section id="staffPanel" class="panel">
    <form id="staffForm">
      <label for="email">البريد الإلكتروني</label>
      <input type="email" id="email" required>
      <label for="staffPassword">كلمة المرور</label>
      <input type="password" id="staffPassword" required>
      <button type="submit" id="staffLoginBtn">تسجيل دخول الإدارة</button>
      <div id="staffError" class="form-error"></div>
    </form>
  </section>
  <p style="text-align:center"><a href="index.html">العودة للرئيسية</a></p>
</div>

<script type="module">
  import { supabase } from './js/supabase-client.js?v=20260805-8';
  import { signInWithEmail, syncLegacySession, getDashboardPath } from './js/auth-service.js?v=20260805-8';

  const customerTab=document.getElementById('customerTab'),staffTab=document.getElementById('staffTab'),customerPanel=document.getElementById('customerPanel'),staffPanel=document.getElementById('staffPanel');
  function tab(mode){const c=mode==='customer';customerTab.classList.toggle('active',c);staffTab.classList.toggle('active',!c);customerPanel.classList.toggle('active',c);staffPanel.classList.toggle('active',!c)}
  customerTab.onclick=()=>tab('customer');staffTab.onclick=()=>tab('staff');
  const normalize=(code,value)=>`${code}${String(value).replace(/\D/g,'').replace(/^0+/,'')}`;

  document.getElementById('customerForm').addEventListener('submit',async e=>{
    e.preventDefault();const box=document.getElementById('customerError'),btn=document.getElementById('customerLoginBtn');box.textContent='';
    const phone=normalize(document.getElementById('countryCode').value,document.getElementById('phone').value);const password=document.getElementById('customerPassword').value;
    btn.disabled=true;btn.textContent='جاري الدخول...';
    try{
      const {data,error}=await supabase.rpc('customer_password_login',{p_phone:phone,p_password:password});if(error)throw error;if(!data?.ok)throw new Error(data?.message||'بيانات الدخول غير صحيحة');
      localStorage.setItem('customerPortalToken',data.token);localStorage.setItem('loggedInUser',JSON.stringify(data.customer));localStorage.removeItem('viewedBy');localStorage.removeItem('isAdminViewing');
      location.replace('dashboard.html?view=customer');
    }catch(err){console.error('[Customer Login]',err);box.textContent=err.message||'تعذر تسجيل الدخول. تأكد من تنفيذ CUSTOMER_PASSWORD_LOGIN.sql';}
    finally{btn.disabled=false;btn.textContent='تسجيل الدخول كعميل'}
  });

  document.getElementById('staffForm').addEventListener('submit',async e=>{
    e.preventDefault();const box=document.getElementById('staffError'),btn=document.getElementById('staffLoginBtn');box.textContent='';btn.disabled=true;
    try{await signInWithEmail(document.getElementById('email').value.trim(),document.getElementById('staffPassword').value);const profile=await syncLegacySession();location.replace(getDashboardPath(profile));}
    catch(err){console.error('[Staff Login]',err);box.textContent=err.message||'تعذر تسجيل الدخول';}
    finally{btn.disabled=false}
  });
</script>
</body>
</html>
