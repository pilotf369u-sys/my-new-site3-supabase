<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول - MeshWar</title>
  <style>
    *{box-sizing:border-box}
    body{font-family:Tahoma,sans-serif;background:#f4f6f9;padding:20px;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
    .box{background:#fff;padding:30px;border-radius:15px;width:100%;max-width:430px;box-shadow:0 4px 14px rgba(0,0,0,.1)}
    h2{text-align:center;color:#2c3e50;margin-top:0;margin-bottom:24px}
    label{display:block;font-weight:bold;margin-top:12px;color:#333}
    input,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;font-size:15px}
    button{width:100%;padding:12px;background:#c00;color:#fff;border:0;border-radius:8px;cursor:pointer;font-weight:bold;font-size:16px;margin-top:12px}
    button:disabled{opacity:.65;cursor:not-allowed}
    .form-error{min-height:22px;margin-top:10px;color:#b00020;font-size:14px;line-height:1.6;text-align:center}
    .hint{text-align:center;font-size:13px;color:#777;line-height:1.6;margin:14px 0 0}
    a{color:#2980b9;text-decoration:none}
    .country-wrap{display:none}
    .country-wrap.visible{display:block}
  </style>
</head>
<body>
<div class="box">
  <h2>تسجيل الدخول</h2>

  <form id="loginForm" novalidate>
    <label for="identifier">البريد الإلكتروني أو رقم الهاتف</label>
    <input type="text" id="identifier" autocomplete="username" placeholder="example@email.com أو 5378240430" required>

    <div id="countryWrap" class="country-wrap visible">
      <label for="countryCode">رمز الدولة</label>
      <select id="countryCode">
        <option value="+964">العراق (+964)</option>
        <option value="+90">تركيا (+90)</option>
        <option value="+966">السعودية (+966)</option>
        <option value="+971">الإمارات (+971)</option>
      </select>
    </div>

    <label for="password">كلمة المرور</label>
    <input type="password" id="password" autocomplete="current-password" required>

    <button type="submit" id="loginBtn">تسجيل الدخول</button>
    <div id="loginError" class="form-error" aria-live="polite"></div>
  </form>

  <p class="hint">استخدم بيانات الدخول التي منحها لك مسؤول النظام.</p>
  <p style="text-align:center"><a href="index.html">العودة للرئيسية</a></p>
</div>

<script type="module">
  import { supabase } from './js/supabase-client.js?v=20260805-10';
  import { signInWithEmail, signInWithPhone, syncLegacySession, getDashboardPath } from './js/auth-service.js?v=20260805-10';

  const form = document.getElementById('loginForm');
  const identifierInput = document.getElementById('identifier');
  const passwordInput = document.getElementById('password');
  const countryWrap = document.getElementById('countryWrap');
  const countryCode = document.getElementById('countryCode');
  const errorBox = document.getElementById('loginError');
  const button = document.getElementById('loginBtn');

  const isEmail = value => String(value).includes('@');

  function normalizePhone(code, value) {
    const digits = String(value || '').replace(/\D/g, '').replace(/^0+/, '');
    const countryDigits = String(code || '').replace(/\D/g, '');
    return digits.startsWith(countryDigits) ? `+${digits}` : `+${countryDigits}${digits}`;
  }

  function updateIdentifierMode() {
    countryWrap.classList.toggle('visible', !isEmail(identifierInput.value.trim()));
  }

  function clearOldSessions() {
    localStorage.removeItem('customerPortalToken');
    localStorage.removeItem('loggedInUser');
    localStorage.removeItem('viewedBy');
    localStorage.removeItem('isAdminViewing');
    localStorage.removeItem('isEmployeeViewing');
    sessionStorage.removeItem('selectedCustomerPhone');
    sessionStorage.removeItem('openedByAdmin');
  }

  async function finishStaffLogin() {
    const profile = await syncLegacySession();
    if (!profile) throw new Error('تعذر العثور على صلاحية الحساب.');
    location.replace(getDashboardPath(profile));
  }

  async function tryCustomerLogin(phone, password) {
    const { data, error } = await supabase.rpc('customer_password_login', {
      p_phone: phone,
      p_password: password,
    });

    if (error) {
      console.error('[Customer Login RPC]', error);
      const text = `${error.message || ''} ${error.details || ''}`.toLowerCase();
      if (text.includes('could not find the function') || text.includes('schema cache')) {
        throw new Error('خدمة دخول العملاء لم تُحمّل بعد. انتظر قليلاً ثم حدّث الصفحة.');
      }
      throw new Error(error.message || 'تعذر الاتصال بخدمة دخول العملاء.');
    }

    if (!data?.ok) return false;

    clearOldSessions();
    localStorage.setItem('customerPortalToken', data.token);
    localStorage.setItem('loggedInUser', JSON.stringify(data.customer));
    location.replace('dashboard.html?view=customer');
    return true;
  }

  identifierInput.addEventListener('input', updateIdentifierMode);

  form.addEventListener('submit', async event => {
    event.preventDefault();
    errorBox.textContent = '';

    const identifier = identifierInput.value.trim();
    const password = passwordInput.value;

    if (!identifier || !password) {
      errorBox.textContent = 'أدخل البريد الإلكتروني أو رقم الهاتف وكلمة المرور.';
      return;
    }

    button.disabled = true;
    button.textContent = 'جاري تسجيل الدخول...';

    try {
      if (isEmail(identifier)) {
        clearOldSessions();
        await signInWithEmail(identifier, password);
        await finishStaffLogin();
        return;
      }

      const phone = normalizePhone(countryCode.value, identifier);

      if (await tryCustomerLogin(phone, password)) return;

      try {
        clearOldSessions();
        await signInWithPhone(phone, password);
        await finishStaffLogin();
      } catch (staffError) {
        console.error('[Unified Login] Phone login failed:', staffError);
        throw new Error('رقم الهاتف أو كلمة المرور غير صحيحة. إذا أنشأ الأدمن الحساب سابقاً، يجب فتح العميل من إدارة العملاء وتعيين كلمة المرور مرة واحدة.');
      }
    } catch (error) {
      console.error('[Unified Login]', error);
      errorBox.textContent = error?.message || 'تعذر تسجيل الدخول. تحقق من البيانات وحاول مجدداً.';
    } finally {
      button.disabled = false;
      button.textContent = 'تسجيل الدخول';
    }
  });

  updateIdentifierMode();
</script>
</body>
</html>
