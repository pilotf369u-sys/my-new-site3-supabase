<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>تسجيل الدخول - MeshWar</title>
  <script>
    (async()=>{try{if('serviceWorker'in navigator){const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()));}if('caches'in window){const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)));}}catch(e){console.error('[Cache cleanup]',e)}})();
  </script>
  <style>*{box-sizing:border-box}body{font-family:Tahoma,sans-serif;background:#f4f6f9;padding:20px;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}.box{background:#fff;padding:30px;border-radius:15px;width:100%;max-width:430px;box-shadow:0 4px 14px rgba(0,0,0,.1)}h2{text-align:center;color:#2c3e50;margin:0 0 24px}label{display:block;font-weight:bold;margin-top:12px;color:#333}input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;font-size:15px}button{width:100%;padding:12px;background:#c00;color:#fff;border:0;border-radius:8px;cursor:pointer;font-weight:bold;font-size:16px;margin-top:12px}button:disabled{opacity:.65}.form-error{min-height:22px;margin-top:10px;color:#b00020;font-size:14px;line-height:1.6;text-align:center}.hint{text-align:center;font-size:13px;color:#777;line-height:1.6;margin:14px 0 0}a{color:#2980b9;text-decoration:none}</style>
</head>
<body>
<div class="box">
  <h2>تسجيل الدخول</h2>
  <form id="loginForm" novalidate>
    <label for="identifier">البريد الإلكتروني أو رقم الهاتف الكامل</label>
    <input type="text" id="identifier" autocomplete="username" placeholder="example@email.com أو 9012345678" required>
    <label for="password">كلمة المرور</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <button type="submit" id="loginBtn">تسجيل الدخول</button>
    <div id="loginError" class="form-error" aria-live="polite"></div>
  </form>
  <p class="hint">اكتب رقم الهاتف كاملاً مع مفتاح الدولة، بالأرقام فقط ومن دون علامة +.</p>
  <p style="text-align:center"><a href="index.html">العودة للرئيسية</a></p>
</div>
<script type="module">
import { supabase } from './js/supabase-client.js?v=20260805-26';
import { signInWithEmail, signInWithPhone, syncLegacySession, getDashboardPath, removeLegacyServiceWorkers } from './js/auth-service.js?v=20260805-26';
await removeLegacyServiceWorkers();

const form=document.getElementById('loginForm');
const identifierInput=document.getElementById('identifier');
const passwordInput=document.getElementById('password');
const errorBox=document.getElementById('loginError');
const button=document.getElementById('loginBtn');
const digits=value=>String(value||'').replace(/\D/g,'');
const isEmail=value=>String(value||'').includes('@');

function clearOldSessions(){
  ['customerPortalToken','loggedInUser','viewedBy','isAdminViewing','isEmployeeViewing'].forEach(key=>localStorage.removeItem(key));
  sessionStorage.removeItem('selectedCustomerPhone');
  sessionStorage.removeItem('openedByAdmin');
}

async function finishStaffLogin(){
  const profile=await syncLegacySession();
  if(!profile) throw new Error('تعذر العثور على صلاحية الحساب.');
  location.replace(getDashboardPath(profile));
}

async function signInCustomer(phone,password){
  const candidates=[...new Set([phone,phone.replace(/^0+/, '')].filter(Boolean))];
  for(const candidate of candidates){
    const {data,error}=await supabase.rpc('customer_password_login_v2',{p_phone:candidate,p_password:password});
    console.info('[Customer Login v2]',{phone:candidate,ok:data?.ok,error:error?.message||null,message:data?.message||null});
    if(error) throw new Error(error.message||'تعذر الاتصال بخدمة دخول العملاء.');
    if(data?.ok){
      clearOldSessions();
      localStorage.setItem('customerPortalToken',data.token);
      localStorage.setItem('loggedInUser',JSON.stringify(data.customer));
      location.replace('dashboard.html?view=customer');
      return true;
    }
  }
  return false;
}

form.addEventListener('submit',async event=>{
  event.preventDefault();
  errorBox.textContent='';
  const identifier=identifierInput.value.trim();
  const password=passwordInput.value;
  if(!identifier||!password){errorBox.textContent='أدخل البريد الإلكتروني أو رقم الهاتف وكلمة المرور.';return;}
  button.disabled=true;
  button.textContent='جاري تسجيل الدخول...';
  try{
    if(isEmail(identifier)){
      clearOldSessions();
      await signInWithEmail(identifier,password);
      await finishStaffLogin();
      return;
    }

    const phone=digits(identifier);
    if(!phone) throw new Error('أدخل رقم هاتف صحيحاً بالأرقام فقط.');

    if(await signInCustomer(phone,password)) return;

    try{
      clearOldSessions();
      await signInWithPhone(phone,password);
      await finishStaffLogin();
      return;
    }catch(staffError){
      console.warn('[Staff phone login]',staffError);
      throw new Error('رقم الهاتف أو كلمة المرور غير صحيحة.');
    }
  }catch(error){
    console.error('[Unified Login]',error);
    errorBox.textContent=error?.message||'تعذر تسجيل الدخول.';
  }finally{
    button.disabled=false;
    button.textContent='تسجيل الدخول';
  }
});
</script>
</body>
</html>
