<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>لوحة الإدارة - MeshWar</title>
  <meta http-equiv="refresh" content="0; url=admin-dashboard-clean.html?v=20260805-24">
</head>
<body>
  <p>جاري فتح لوحة الإدارة السحابية...</p>
  <script>
    (async function () {
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration => registration.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(key => caches.delete(key)));
        }
        ['adminCustomersList','orders','customers','meshwar_orders'].forEach(key => localStorage.removeItem(key));
      } catch (error) {
        console.error('[Legacy admin retirement]', error);
      } finally {
        location.replace('admin-dashboard-clean.html?v=20260805-24');
      }
    })();
  </script>
</body>
</html>
