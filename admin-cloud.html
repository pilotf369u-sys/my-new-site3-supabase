<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الإدارة السحابية</title><style>body{font-family:Segoe UI,sans-serif;background:#f4f6f9;margin:0;padding:20px;color:#172033}header,.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 4px 14px #00000012;margin-bottom:18px}h1,h2{margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}input,select,button,textarea{padding:10px;border:1px solid #ccd3df;border-radius:8px;font:inherit;box-sizing:border-box}button{cursor:pointer;background:#063b70;color:#fff;border:0}.danger{background:#b42318}.ok{background:#16803c}.muted{color:#667085}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e7eaf0;text-align:right;vertical-align:top}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button.active{background:#d71920}.hidden{display:none}.status{padding:8px;border-radius:8px;background:#f0f5ff;margin-top:10px}@media(max-width:700px){body{padding:10px}table{font-size:12px}}</style></head><body><header><h1>لوحة الإدارة السحابية</h1><div class="tabs"><button data-tab="customers" class="active">العملاء</button><button data-tab="orders">الطلبات</button><button data-tab="messages">الرسائل</button><button data-tab="rewards">المكافآت</button><button id="refreshBtn">تحديث</button><button id="logoutBtn" class="danger">خروج</button></div><div id="status" class="status">جاري الاتصال بـ Supabase...</div></header><section id="customers" class="card"><h2>العملاء</h2><form id="customerForm" class="grid"><input type="hidden" id="customerId"><input id="name" placeholder="الاسم" required><input id="phone" placeholder="الهاتف" required><input id="password" placeholder="كلمة المرور"><input id="code" placeholder="كود العميل"><input id="email" placeholder="البريد"><input id="country" placeholder="الدولة"><input id="address" placeholder="العنوان"><button type="submit" class="ok">حفظ العميل</button><button type="button" id="cancelEdit">إلغاء التعديل</button></form><div style="overflow:auto"><table><thead><tr><th>الكود</th><th>الاسم</th><th>الهاتف</th><th>الدولة</th><th>العنوان</th><th>إجراءات</th></tr></thead><tbody id="customersBody"></tbody></table></div></section><section id="orders" class="card hidden"><h2>الطلبات</h2><div style="overflow:auto"><table><thead><tr><th>الطلب</th><th>العميل</th><th>الهاتف</th><th>الحالة</th><th>التاريخ</th><th>تحديث</th></tr></thead><tbody id="ordersBody"></tbody></table></div></section><section id="messages" class="card hidden"><h2>الرسائل</h2><form id="messageForm" class="grid"><select id="messageCustomer" required></select><select id="messageOrder"><option value="">بدون طلب محدد</option></select><textarea id="messageBody" placeholder="نص الرسالة" required></textarea><button type="submit">إرسال</button></form><div id="messagesList"></div></section><section id="rewards" class="card hidden"><h2>المكافآت</h2><form id="rewardForm" class="grid"><select id="rewardCustomer" required></select><input id="rewardAmount" type="number" step="0.01" placeholder="القيمة" required><input id="rewardNote" placeholder="ملاحظة"><button type="submit" class="ok">منح مكافأة</button></form><div style="overflow:auto"><table><thead><tr><th>العميل</th><th>القيمة</th><th>الملاحظة</th><th>التاريخ</th></tr></thead><tbody id="rewardsBody"></tbody></table></div></section><script type="module" src="js/admin-cloud.js"></script></body></html>
