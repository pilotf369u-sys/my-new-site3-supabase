<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسوق من Meshwar</title>
<style>
*{box-sizing:border-box}body{font-family:'Segoe UI',Tahoma,sans-serif;background:linear-gradient(135deg,#e0eafc,#cfdef3);margin:0;padding:20px 20px 50px;min-height:100vh}.search-container{text-align:center;margin:30px 0}.search-container input{padding:15px 25px;width:85%;max-width:450px;border-radius:50px;border:0;outline:0;box-shadow:0 10px 20px #0002;font-size:16px}.product-grid{display:grid;grid-template-columns:repeat(auto-fill,200px);justify-content:center;gap:35px;padding:20px}.product-card{width:200px;border-radius:20px;padding:15px;text-align:center;background:#fff;box-shadow:0 8px 15px #0002}.product-card img{width:100%;height:150px;object-fit:contain;border-radius:15px}.product-code{display:block;font-weight:bold;color:#777}.product-price{color:#e63946;font-weight:bold}.action{background:linear-gradient(to right,#25d366,#128c7e);color:#fff;padding:12px;border:0;border-radius:10px;cursor:pointer;width:100%;font-weight:bold;margin-top:10px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:1000;padding:30px;overflow:auto}.modal-content{background:#fff;width:100%;max-width:380px;margin:auto;padding:25px;border-radius:20px}.group{margin-bottom:13px}.group label{display:block;font-size:14px;margin-bottom:5px;font-weight:bold}.group input{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px}.group input[readonly]{background:#eef2f5}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>
<body>
<h1 style="text-align:center">مرحباً بك في متجر Meshwar</h1>
<div class="search-container"><input id="searchInput" placeholder="🔍 ابحث عن منتج بالاسم أو الكود..."></div>
<div class="product-grid" id="product-container"><p>جاري تحميل المنتجات...</p></div>
<div id="orderModal" class="modal"><div class="modal-content">
<h3 style="text-align:center">إضافة المنتج إلى السلة</h3>
<div class="group"><label>الاسم الكريم</label><input id="pName" readonly></div>
<div class="group"><label>رقم الهاتف</label><input id="pPhone" readonly></div>
<div class="two"><div class="group"><label>الدولة</label><input id="pCountry" readonly></div><div class="group"><label>العنوان</label><input id="pAddress" readonly></div></div>
<div class="two"><div class="group"><label>العدد</label><input type="number" id="pQuantity" value="1" min="1"></div><div class="group"><label>اللون</label><input id="pColor" placeholder="اللون المطلوب"></div></div>
<div class="two"><div class="group"><label>المقاس</label><input id="pSize"></div><div class="group"><label>الوزن</label><input id="pWeight"></div></div>
<button id="submitOrderBtn" class="action">إضافة إلى السلة السحابية</button>
<button id="closeModalBtn" style="margin-top:10px;border:0;background:none;width:100%;cursor:pointer">إغلاق</button>
</div></div>
<script type="module">
import { getProducts } from './js/products-service.js?v=20260806-cloud';
import { getCustomerPortalData } from './js/auth-service.js?v=20260806-cloud';
import { addProductToCart } from './js/cart-service.js?v=20260806-cloud';

let products=[];let currentProduct=null;
const container=document.getElementById('product-container');
const esc=(v='')=>String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
function renderProducts(){const term=document.getElementById('searchInput').value.trim().toLowerCase();const list=products.filter(p=>String(p.name).toLowerCase().includes(term)||String(p.code).toLowerCase().includes(term));container.innerHTML=list.length?'':'<p>لا توجد منتجات مطابقة.</p>';list.forEach(product=>{const card=document.createElement('div');card.className='product-card';card.innerHTML=`<img src="${esc(product.image||'')}" alt="${esc(product.name)}"><h3>${esc(product.name)}</h3><span class="product-code">الكود: ${esc(product.code)}</span><div>${product.old_price_label?`<s>${esc(product.old_price_label)}</s> `:''}<span class="product-price">${esc(product.price_label)}</span></div><button class="action">أضف إلى السلة</button>`;card.querySelector('button').onclick=()=>openModal(product);container.appendChild(card)})}
async function openModal(product){try{const portal=await getCustomerPortalData();if(!portal?.customer){alert('يرجى تسجيل الدخول بحساب العميل أولاً.');location.href='login.html';return}const c=portal.customer;currentProduct=product;document.getElementById('pName').value=c.name||'';document.getElementById('pPhone').value=c.phone||'';document.getElementById('pCountry').value=c.country||'';document.getElementById('pAddress').value=c.address||'';document.getElementById('pQuantity').value='1';document.getElementById('pColor').value='';document.getElementById('pSize').value='';document.getElementById('pWeight').value='';document.getElementById('orderModal').style.display='flex'}catch(error){alert(error.message);location.href='login.html'}}
async function submitOrder(){if(!currentProduct)return;const quantity=Number.parseInt(document.getElementById('pQuantity').value,10);const color=document.getElementById('pColor').value.trim();const size=document.getElementById('pSize').value.trim();const weight=document.getElementById('pWeight').value.trim();if(!Number.isInteger(quantity)||quantity<1){alert('الكمية غير صحيحة.');return}try{await addProductToCart({productId:currentProduct.id,quantity,unitPrice:currentProduct.price,color,size,weight});document.getElementById('orderModal').style.display='none';alert('تمت إضافة المنتج إلى السلة السحابية بنجاح.')}catch(error){alert(error.message)}}
document.getElementById('searchInput').addEventListener('input',renderProducts);document.getElementById('submitOrderBtn').onclick=submitOrder;document.getElementById('closeModalBtn').onclick=()=>document.getElementById('orderModal').style.display='none';
try{products=await getProducts();renderProducts()}catch(error){console.error(error);container.innerHTML='<p>تعذر تحميل المنتجات من Supabase.</p>'}
</script>
</body></html>
